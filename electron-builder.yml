appId: com.giligans.girecon
productName: Gi-Recon
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  
# Critical for SQLite: Native binaries cannot run from inside the ASAR file
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**

win:
  executableName: gi-recon
  target:
    - nsis # Standard Windows Installer
  icon: resources/icon.ico # Make sure you have a .ico version for Windows

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false # Recommended for business apps to give users install options
  allowToChangeInstallationDirectory: true

# Rebuilds the C++ SQLite module for the Windows environment during packaging
npmRebuild: true